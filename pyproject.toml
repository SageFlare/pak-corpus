[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pakcorpus-validate"
version = "0.1.0"
description = "Validator for the Chivalry 2 pen-test pak corpus manifest"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pak-corpus-validate = "pakcorpus_validate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pakcorpus_validate*"]
